name: Hygiene

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check spelling
        uses: crate-ci/typos@v1.51.1

  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'

      - name: Check text file hygiene
        run: node scripts/check-file-hygiene.mjs
