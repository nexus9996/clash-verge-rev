name: Cross Platform Cargo Check

on:
  workflow_dispatch:
#   pull_request:
#   push:
# branches: [main, dev]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  cargo-check:
    # Treat all Rust compiler warnings as errors
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Bun install and check
        run: |
          bun install --frozen-lockfile
          bun run prebuild:download ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Cargo Check (deny warnings)
        working-directory: src-tauri
        run: |
          cargo check --target ${{ matrix.target }} --workspace --all-features
